# Racha backend: `docker compose up -d` and the API is served on http://localhost:${RACHA_PORT:-8080}.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RACHA_DB_NAME:-racha}
      POSTGRES_USER: ${RACHA_DB_USER:-racha}
      POSTGRES_PASSWORD: ${RACHA_DB_PASSWORD:-racha}
    volumes:
      - racha-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RACHA_DB_URL: jdbc:postgresql://db:5432/${RACHA_DB_NAME:-racha}
      RACHA_DB_USER: ${RACHA_DB_USER:-racha}
      RACHA_DB_PASSWORD: ${RACHA_DB_PASSWORD:-racha}
      RACHA_BASE_PATH: ${RACHA_BASE_PATH:-}
    ports:
      - "${RACHA_PORT:-8080}:8080"

volumes:
  racha-db:
