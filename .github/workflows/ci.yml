name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --console=plain
      - name: Docker image builds
        run: docker build -t racha-server:ci .

  client:
    name: Client (tests + Android APK + desktop)
    runs-on: ubuntu-24.04
    # Normally ~5 min; a test that hangs must not hold the runner for hours.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: libmpv (desktop player, metadata, thumbnails), Xvfb + Mesa (player harness), a decimal-comma locale
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 xvfb xauth libgl1-mesa-dri libegl1 locales libgtk-3-0t64 libxtst6
          sudo locale-gen es_ES.UTF-8
      - name: Tests, APK and desktop jar
        id: tests
        # Normally ~5 min. Gradle gets 15: if it is not done by then, the JVMs still running (Gradle, its workers, test
        # JVMs) are dumped for the report below. Nothing runs in the background, so nothing can hold the step open.
        timeout-minutes: 20
        run: |
          set +e +o pipefail
          timeout 15m ./gradlew check :android:assembleDebug :desktop:jar --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" = 124 ]; then
            for pid in $(pgrep java); do timeout 30 jcmd "$pid" Thread.print > "$RUNNER_TEMP/threads-$pid.txt" 2>&1; done
          fi
          ./gradlew --stop > /dev/null 2>&1
          exit $status
      - name: Hang report (public annotations; logs need a login)
        if: always() && steps.tests.outcome != 'success'
        run: |
          set +e +o pipefail
          log="$RUNNER_TEMP/gradle.log"
          # Tests that started and never ended.
          python3 - "$log" <<'PY'
          import re, sys
          started, ended = [], set()
          for line in open(sys.argv[1], errors="replace"):
              m = re.match(r"^(.+?) (STARTED|PASSED|FAILED|SKIPPED)$", line.strip())
              if m:
                  (started.append if m.group(2) == "STARTED" else ended.add)(m.group(1))
          running = [t for t in started if t not in ended]
          if running:
              print("::error title=Tests that never ended::" + " | ".join(running[-10:]))
          PY
          echo "::error title=Last lines of the build::$(grep -v '^\s*$' "$log" | tail -25 | tr '\n' ' ' | cut -c1-3500)"
          for f in "$RUNNER_TEMP"/threads-*.txt; do
            [ -f "$f" ] || continue
            who=$(head -3 "$f" | tr '\n' ' ' | cut -c1-150)
            busy=$(grep -E 'at (io\.github\.roberbarras|org\.gradle\.api\.internal\.tasks\.testing|org\.junit|java\.net\.|sun\.nio)' "$f" | sort | uniq -c | sort -rn | head -12 | tr '\n' ' ' | cut -c1-3000)
            echo "::error title=Threads $(basename "$f")::$who :: ${busy:-nothing of the app}"
          done
      - name: Failing tests (public annotations; logs need a login)
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      text = (bad.get("message") or bad.text or "").replace("\n", " ")[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: Linux resource viewer end to end (JavaFX WebKit page checks, PDF, text in Xvfb)
        run: |
          cp=$(./gradlew -q --console=plain :desktop:printTestRuntimeClasspath | tail -1)
          home=$(mktemp -d)
          set +e
          HOME=$home timeout -k 5 240 xvfb-run -a -s "-screen 0 1600x900x24" \
            java -Xmx768m --enable-native-access=ALL-UNNAMED \
              --add-exports=java.desktop/sun.awt=ALL-UNNAMED --add-exports=java.desktop/sun.awt.X11=ALL-UNNAMED \
              -Duser.home=$home -Dracha.mpv.ao=null \
              -cp "$cp" io.github.roberbarras.racha.desktop.resource.ResourceHarnessKt > $home/harness.log 2>&1
          status=$?
          cat $home/harness.log
          if [ $status != 0 ]; then
            echo "::error title=Resource harness ($status)::$(grep -E 'RESULT|Exception' $home/harness.log | tail -6 | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $status
      - name: Linux player end to end (real window in Xvfb, no audio)
        run: |
          cp=$(./gradlew -q --console=plain :desktop:printTestRuntimeClasspath | tail -1)
          home=$(mktemp -d)
          set +e
          HOME=$home RACHA_MPV_LOG=$home/mpv.log timeout -k 5 180 xvfb-run -a -s "-screen 0 1600x900x24" \
            java -Xmx512m --enable-native-access=ALL-UNNAMED \
              --add-exports=java.desktop/sun.awt=ALL-UNNAMED --add-exports=java.desktop/sun.awt.X11=ALL-UNNAMED \
              -Duser.home=$home -Dracha.mpv.ao=null \
              -cp "$cp" io.github.roberbarras.racha.desktop.player.PlayerHarnessKt > $home/harness.log 2>&1
          status=$?
          cat $home/harness.log
          if [ $status != 0 ]; then
            # Logs need a login to read; annotations are public: surface the result and mpv's video output choice.
            echo "::error title=Player harness ($status)::$(grep -E 'RESULT|STEP|Exception|X Error' $home/harness.log | tail -8 | tr '\n' ' ' | cut -c1-900)"
            echo "::error title=mpv video output::$(grep -E 'Initializing GPU context|Using|\[vo/.*(error|fail|Fail)|VO:' $home/mpv.log | tail -10 | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $status
      - uses: actions/upload-artifact@v7
        with:
          name: racha-android-debug-apk
          path: client/android/build/outputs/apk/debug/*.apk
          retention-days: 7

  appimage:
    name: Linux AppImage (libmpv bundled, self-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: libmpv to bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2
      - name: AppImage tools (appimagetool, type2 runtime, linuxdeploy)
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -sfLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sfLo runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          curl -sfLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x appimagetool linuxdeploy
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.1-${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          t="$RUNNER_TEMP/tools"
          desktop/packaging/build-appimage.sh "$t/appimagetool" "$t/runtime-x86_64" "$t/linuxdeploy" "$version"
      - name: Self-test (bundled libmpv decodes a generated clip; no window, no sound)
        run: |
          image="desktop/build/appimage/Racha-$VERSION-x86_64.AppImage"
          env -u DISPLAY "$image" --appimage-extract-and-run --self-test
          ls -lh "$image"
      - uses: actions/upload-artifact@v7
        with:
          name: racha-appimage
          path: client/desktop/build/appimage/Racha-*-x86_64.AppImage
          retention-days: 14

  sync-e2e:
    name: Sync end to end (two clients against the real server)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Server and PostgreSQL (docker compose)
        env:
          RACHA_PORT: "18080"
        run: |
          set -o pipefail
          export RACHA_JWT_SECRET=$(openssl rand -base64 48)
          if ! docker compose -p racha-e2e up -d --build 2>&1 | tee "$RUNNER_TEMP/compose.log"; then
            # Logs need a login: the end of the build output as a public annotation.
            echo "::error title=docker compose up::$(tail -15 "$RUNNER_TEMP/compose.log" | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          for i in $(seq 1 60); do
            curl -sf http://localhost:18080/actuator/health && exit 0
            sleep 2
          done
          docker compose -p racha-e2e logs server
          exit 1
      - name: Two devices sync progress, bookmarks, history, favourites and settings
        working-directory: client
        env:
          RACHA_E2E_URL: http://localhost:18080
        run: ./gradlew :shared:remote:jvmTest --tests '*EndToEndSyncTest*' --rerun --console=plain
      - name: Server logs
        if: failure()
        run: docker compose -p racha-e2e logs server
      - name: Stop
        if: always()
        run: docker compose -p racha-e2e down -v

  android-device:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scanning, database, UI and player on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          # The plain AOSP image, as the release smoke: the tests need nothing from Google, and the google_apis image
          # started to drop off adb right after boot (exit 224, no test run) on 2026-11-18.
          target: default
          arch: x86_64
          # Software video decoding with 2 GB brought the emulator's system down mid-test ("System has crashed").
          ram-size: 4096M
          heap-size: 576M
          # No disk-size: an enlarged data partition leaves apps without their data directories on this image.
          # The emulator's goldfish hardware decoders need a host GPU; software decoders are what CI can run.
          # Rendering in the guest: with swiftshader_indirect, system_server crashed taking a task snapshot
          # (TaskSnapshotConvertUtil → ImageReader.getPlanes → lockImageFromBuffer) on runner image 20261116.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu guest -feature -HardwareDecoder
          disable-animations: true
          working-directory: client
          # Retries once after restarting adb; on failure, reports why as public annotations.
          script: android/scripts/device-tests.sh
      - name: Failing Android tests (public annotations; logs need a login)
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          for path in glob.glob("android/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              text = open(path, encoding="utf-8").read()
              for m in re.finditer(r'<testcase name="([^"]*)" classname="([^"]*)"[^>]*>\s*<failure>(.*?)</failure>', text, re.S):
                  lines = [l.strip() for l in html.unescape(m.group(3)).splitlines() if l.strip() and not l.strip().startswith("at ")]
                  print(f"::error title={m.group(2)}.{m.group(1)}::{' / '.join(lines[:4])[:900]}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: client/android/build/reports/androidTests/
          retention-days: 7

  android-release:
    name: Android release APK (R8) and its smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Release signing (ADR-0009); empty in forks and until the secrets are set: debug-signed release then.
      RACHA_KEYSTORE_PASSWORD: ${{ secrets.RACHA_KEYSTORE_PASSWORD }}
      RACHA_KEY_ALIAS: ${{ secrets.RACHA_KEY_ALIAS }}
      RACHA_KEY_PASSWORD: ${{ secrets.RACHA_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Release keystore (only when the repository has it in its secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.RACHA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/racha-release.jks"
            echo "RACHA_KEYSTORE=$RUNNER_TEMP/racha-release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice title=Android release::No signing secrets: the release APK is signed with the debug key (not for distribution)."
          fi
      - name: Release APK (R8)
        # It has failed early twice in CI and never locally: say why (logs need a login), and try once more.
        run: |
          set -o pipefail
          why() { grep -A12 'What went wrong' "$1" | head -14 | tr '\n' ' ' | cut -c1-1500; }
          # A tag vX.Y.Z is the app's version; versionCode = X*10000 + Y*100 + Z (1.0.0 → 10000, always increasing).
          args=()
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            args=(-Pracha.version="${GITHUB_REF_NAME#v}" -Pracha.versionCode=$((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3])))
          fi
          if ! ./gradlew :android:assembleRelease "${args[@]}" --console=plain 2>&1 | tee "$RUNNER_TEMP/release1.log"; then
            echo "::warning title=Release APK, first attempt::$(why "$RUNNER_TEMP/release1.log")"
            if ! ./gradlew :android:assembleRelease "${args[@]}" --console=plain 2>&1 | tee "$RUNNER_TEMP/release2.log"; then
              echo "::error title=Release APK::$(why "$RUNNER_TEMP/release2.log")"
              exit 1
            fi
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release smoke on a device
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          # The plain AOSP image: on google_apis, Chrome, WebView and Trichrome fill the 774 MB data partition (an
          # enlarged one breaks app data directories), and the app needs nothing from Google Play services.
          target: default
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -HardwareDecoder
          disable-animations: true
          working-directory: client
          script: android/scripts/release-smoke.sh android/build/outputs/apk/release/android-release.apk
      - name: Release smoke report (public annotation; logs need a login)
        if: failure() || cancelled()
        run: |
          if [ -f /tmp/racha-release-smoke.txt ]; then
            echo "::error title=Release smoke::$(tail -c 2500 /tmp/racha-release-smoke.txt | tr '\n' ' ')"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: racha-android-release-apk
          path: client/android/build/outputs/apk/release/android-release.apk
          retention-days: 14

  release:
    name: GitHub release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, client, appimage, sync-e2e, android-device, android-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv artifacts/racha-android-release-apk/android-release.apk "Racha-$version.apk"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Racha $version" --generate-notes \
            artifacts/racha-appimage/Racha-*-x86_64.AppImage "Racha-$version.apk"

