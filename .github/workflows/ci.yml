name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --console=plain
      - name: Docker image builds
        run: docker build -t racha-server:ci .

  client:
    name: Client (tests + Android APK + desktop)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: libmpv for desktop metadata/thumbnail tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2
      - run: ./gradlew check :android:assembleDebug :desktop:jar --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: racha-android-debug-apk
          path: client/android/build/outputs/apk/debug/*.apk
          retention-days: 7
