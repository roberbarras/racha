name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --console=plain
      - name: Docker image builds
        run: docker build -t racha-server:ci .

  client:
    name: Client (tests + Android APK + desktop)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: libmpv for desktop metadata/thumbnail tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2
      - run: ./gradlew check :android:assembleDebug :desktop:jar --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: racha-android-debug-apk
          path: client/android/build/outputs/apk/debug/*.apk
          retention-days: 7

  android-device:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scanning, database, UI and player on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          # The emulator's goldfish hardware decoders need a host GPU; software decoders are what CI can run.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -HardwareDecoder
          disable-animations: true
          working-directory: client
          script: ./gradlew :android:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: client/android/build/reports/androidTests/
          retention-days: 7
