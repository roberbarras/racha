<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Racha · Contraseña</title>
<style>
  :root { --bg: #f4efe8; --surface: #fffcf7; --ink: #1e2430; --muted: #5f6672; --border: #e4dccf; --accent: #e8832e; --on-accent: #1e2430; --error: #b3261e; --ok: #2e7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --surface: #1a1f28; --ink: #f1ece4; --muted: #a3a9b4; --border: #2c3340; --accent: #f0943f; --on-accent: #11151c; --error: #f2b8b5; --ok: #8fd5a6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { margin-top: 20px; width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 16px; min-height: 1.5em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .link { background: none; color: var(--accent); width: auto; padding: 0; margin-top: 12px; font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="intro"></p>

  <form id="request" hidden>
    <label for="request-email" data-t="email"></label>
    <input id="request-email" type="email" autocomplete="email" required>
    <button type="submit" data-t="send"></button>
  </form>

  <form id="reset" hidden>
    <label for="email" data-t="email"></label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="code" data-t="code"></label>
    <input id="code" autocomplete="one-time-code" placeholder="XXXX-XXXX" required>
    <label for="password" data-t="password"></label>
    <input id="password" type="password" autocomplete="new-password" minlength="10" required>
    <label for="repeat" data-t="repeat"></label>
    <input id="repeat" type="password" autocomplete="new-password" minlength="10" required>
    <button type="submit" data-t="save"></button>
    <button type="button" class="link" id="again" data-t="again"></button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>
<script>
  const es = (navigator.language || "es").toLowerCase().startsWith("es");
  const T = es ? {
    title: "Cambiar la contraseña", introRequest: "Te enviaremos un código a tu correo.", introReset: "Escribe el código del correo y tu nueva contraseña.",
    email: "Correo", code: "Código", password: "Nueva contraseña (10 caracteres o más)", repeat: "Repítela", send: "Enviar código", save: "Guardar contraseña",
    again: "No me ha llegado: pedir otro", sent: "Si la cuenta existe, te llegará un correo con el código en unos minutos.",
    mismatch: "Las dos contraseñas no coinciden.", short: "La contraseña necesita al menos 10 caracteres.", done: "Contraseña cambiada. Entra de nuevo en la app con la nueva.",
    invalid_recovery_code: "El código no es correcto o ha caducado.", too_many_attempts: "Demasiados intentos. Prueba dentro de un rato.",
    mail_not_configured: "Este servidor no puede enviar correos. Habla con quien lo administra.", generic: "No se ha podido completar. Inténtalo de nuevo."
  } : {
    title: "Reset your password", introRequest: "We will e-mail you a code.", introReset: "Type the code from the e-mail and your new password.",
    email: "E-mail", code: "Code", password: "New password (10 characters or more)", repeat: "Repeat it", send: "Send code", save: "Save password",
    again: "It did not arrive: send another", sent: "If the account exists, an e-mail with the code will arrive in a few minutes.",
    mismatch: "The two passwords do not match.", short: "The password needs at least 10 characters.", done: "Password changed. Sign in again in the app with the new one.",
    invalid_recovery_code: "The code is wrong or has expired.", too_many_attempts: "Too many attempts. Try again in a while.",
    mail_not_configured: "This server cannot send e-mail. Ask its administrator.", generic: "It could not be done. Try again."
  };
  document.documentElement.lang = es ? "es" : "en";
  document.title = "Racha · " + T.title;
  document.getElementById("title").textContent = T.title;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[el.dataset.t]);

  const $ = id => document.getElementById(id);
  const msg = (text, kind) => { $("msg").textContent = text; $("msg").className = "msg " + (kind || ""); };
  // The link from the e-mail carries email and code in the fragment, which never reaches any server log.
  const params = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);

  function show(step) {
    $("request").hidden = step !== "request";
    $("reset").hidden = step !== "reset";
    $("intro").textContent = step === "request" ? T.introRequest : T.introReset;
  }

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json", "Accept-Language": es ? "es" : "en" }, body: JSON.stringify(body)
    });
    if (response.ok) return null;
    try { return (await response.json()).code || "generic"; } catch { return "generic"; }
  }

  $("request").addEventListener("submit", async e => {
    e.preventDefault();
    const button = e.submitter; button.disabled = true;
    const error = await post("auth/password/forgot", { email: $("request-email").value });
    button.disabled = false;
    if (error) { msg(T[error] || T.generic, "error"); return; }
    $("email").value = $("request-email").value;
    show("reset");
    msg(T.sent, "ok");
    $("code").focus();
  });

  $("reset").addEventListener("submit", async e => {
    e.preventDefault();
    if ($("password").value.length < 10) { msg(T.short, "error"); return; }
    if ($("password").value !== $("repeat").value) { msg(T.mismatch, "error"); return; }
    const button = e.submitter; button.disabled = true;
    const error = await post("auth/password/reset", { email: $("email").value, code: $("code").value, newPassword: $("password").value });
    button.disabled = false;
    if (error) { msg(T[error] || T.generic, "error"); return; }
    $("reset").hidden = true;
    $("intro").textContent = "";
    msg(T.done, "ok");
  });

  $("again").addEventListener("click", () => { $("request-email").value = $("email").value; show("request"); msg(""); });

  if (params.get("code")) {
    $("email").value = params.get("email") || "";
    $("code").value = params.get("code");
    show("reset");
    $("password").focus();
  } else {
    show("request");
  }
</script>
</body>
</html>
