spring:
  application:
    name: racha-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${RACHA_DB_URL:jdbc:postgresql://localhost:5432/racha}
    username: ${RACHA_DB_USER:racha}
    password: ${RACHA_DB_PASSWORD:racha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${RACHA_PORT:8080}
  servlet:
    context-path: ${RACHA_BASE_PATH:}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
